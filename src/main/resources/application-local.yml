server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/coreboard?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  flyway:
    enabled: false
  cloud:
    aws:
      s3:
        enabled: false
jwt:
  secret:
    key: ad28a1bb3bad96055ba5345cbe3c6b99

aes:
  secret:
    key: MySuperSecretKey

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always

cloud:
  aws:
    endpoint: http://minio:9000
    public-url: http://localhost:9000/coreboard-attachments
    credentials:
      access-key: minioadmin
      secret-key: minioadmin123
    s3:
      bucket: coreboard-attachments
    region:
      static: us-east-1

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace